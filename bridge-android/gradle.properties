# Forzamos UTF-8 explícitamente: el entorno de build puede tener un locale
# POSIX/C sin UTF-8, lo que rompe la compilación de tests de Kotlin si algún
# nombre de test (backtick) contiene caracteres no-ASCII. Además de fijar
# esto, evitamos acentos en nombres de test por convención.
org.gradle.jvmargs=-Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8
